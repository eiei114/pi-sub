name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && 'refs/heads/main' || '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  release:
    needs: test
    # Publish on: push to main, manual dispatch, scheduled fallback, or the
    # Version Packages PR being merged (auto-merge does not fire a push event,
    # but the pull_request closed event does).
    if: >-
      needs.test.result == 'success' &&
      (
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.merged == true &&
          github.event.pull_request.head.ref == 'changeset-release/main'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Version Packages PR
        if: >-
          steps.changesets.outputs.published != 'true' &&
          steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            "${{ steps.changesets.outputs.pullRequestNumber }}"
